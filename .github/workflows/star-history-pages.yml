name: Generate Repository Star History

on:
  push:
    branches:
      - master
    paths:
      - "public/**"
      - "tools/repository-metrics/**"
      - ".github/workflows/star-history-pages.yml"
  workflow_run:
    workflows: ["采集仓库统计"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: profile-star-history-pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate repository star histories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAR_HISTORY_REPOSITORIES: ${{ vars.STAR_HISTORY_REPOSITORIES }}
          STAR_HISTORY_DEFAULT_REPOSITORY: Stonewuu/ai-fusion-video
          STAR_HISTORY_PAGES_BASE_URL: https://stonewuu.github.io/Stonewuu
          STAR_HISTORY_SEED_DIR: star-history-seeds
          STAR_HISTORY_SITE_DIR: _site
        run: node tools/github-star-history.mjs

      - name: Copy static pages and media
        run: cp -R public/. _site/

      - name: 读取仓库统计归档
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: traffic-history
          path: .metrics-archive
          persist-credentials: false

      - name: 生成独立的仓库统计页
        run: |
          node --test tools/repository-metrics/*.test.mjs
          node tools/repository-metrics/build.mjs .metrics-archive _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
