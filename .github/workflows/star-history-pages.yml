name: Generate Repository Star History

on:
  push:
    branches:
      - master
    paths:
      - "public/**"
      - "tools/repository-metrics/**"
      - "tools/publish-pages.cjs"
      - "tools/tests/publish-pages.test.cjs"
      - ".github/workflows/star-history-pages.yml"
  workflow_run:
    workflows: ["采集仓库统计"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-star-history-pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建并上传网站
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/repository-metrics/package-lock.json

      - name: Generate repository star histories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAR_HISTORY_REPOSITORIES: ${{ vars.STAR_HISTORY_REPOSITORIES }}
          STAR_HISTORY_DEFAULT_REPOSITORY: Stonewuu/ai-fusion-video
          STAR_HISTORY_PAGES_BASE_URL: https://stonewuu.github.io/Stonewuu
          STAR_HISTORY_SEED_DIR: star-history-seeds
          STAR_HISTORY_SITE_DIR: _site
        run: node tools/github-star-history.mjs

      - name: Copy static pages and media
        run: cp -R public/. _site/

      - name: 读取仓库统计归档
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: traffic-history
          path: .metrics-archive
          persist-credentials: false

      - name: 生成独立的仓库统计页
        run: |
          npm ci --prefix tools/repository-metrics --no-audit --no-fund
          node --test tools/repository-metrics/*.test.mjs tools/tests/publish-pages.test.cjs
          node tools/repository-metrics/build.mjs .metrics-archive _site

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    name: 发布网站
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取发布脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/publish-pages.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 发布本次构建上传的网站
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const { publishPages } = require('./tools/publish-pages.cjs')
            await publishPages({ github, context, core, artifactId: process.env.PAGES_ARTIFACT_ID })

      - name: 取消尚未完成的发布
        if: ${{ (failure() || cancelled()) && steps.deployment.outputs.deployment_id && !steps.deployment.outputs.finished }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$DEPLOYMENT_ID/cancel"
