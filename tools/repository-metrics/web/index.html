<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>仓库统计 · Stonewuu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23262740'/%3E%3Cpath d='m7 27 9-10 5 5L33 8' fill='none' stroke='%2399e4d1' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<!--STYLES-->
</head><body>
<header class="masthead"><div class="shell mast-content">
<a class="repo-link" href="https://github.com/Stonewuu"><span class="brand-mark"><svg aria-hidden="true" viewBox="0 0 36 36"><path d="m6 24 8-9 5 5L30 8"/><path class="brand-trail" d="m7 29 8-9"/></svg></span><strong>Stonewuu</strong><span class="slash">/</span><span class="repo-owner">仓库统计</span></a>
<div class="mast-actions"><a class="archive-link" href="https://github.com/Stonewuu/Stonewuu/tree/traffic-history">数据归档 ↗</a><button class="icon-button" type="button" id="theme" title="切换明暗主题" aria-label="切换明暗主题">◐</button></div>
</div></header>
<main class="shell">
<section class="overview"><div class="hero-head"><div><h1>仓库统计</h1><p class="hero-range" id="overview-period">正在读取仓库数据…</p></div><div class="repo-tabs" id="repo-tabs" role="group" aria-label="选择仓库"></div></div><div id="hero-stats" class="kpis"></div></section>
<p id="load-error" role="alert" hidden></p>
<div id="workspace" hidden>
<section class="panel trend"><div class="panel-head"><h2>指标趋势</h2><div class="seg ranges" id="ranges" role="group" aria-label="时间范围">
<button data-range="7">7 天</button><button data-range="14">14 天</button><button data-range="30">30 天</button><button data-range="90">90 天</button><button data-range="all">全部</button><button data-range="custom" aria-expanded="false" aria-controls="dates">自选</button></div></div>
<form id="dates" class="custom-range" hidden><label>开始日期<input required type="date" id="from"></label><label>结束日期<input required type="date" id="to"></label><button class="outline-button">应用日期</button></form>
<div class="chart-toolbar">
<details class="picker" id="picker"><summary class="outline-button" id="metric-count">选择指标</summary><div class="picker-body"><input type="search" id="metric-search" aria-label="搜索指标" placeholder="搜索指标"><div id="presets" class="presets" role="group" aria-label="常用指标组合"></div><div id="metric-options"></div><button type="button" id="pick-done" class="outline-button">完成</button></div></details>
<div class="seg" id="layout" role="group" aria-label="图表布局"><button data-layout="overlay">合并显示</button><button data-layout="split">拆分显示</button></div>
<div class="control-pair"><label class="field-inline"><span class="sr-only">统计周期</span><select id="grain"><option value="day">按日</option><option value="week">按周</option><option value="month">按月</option></select></label>
<label class="field-inline"><span class="sr-only">纵轴刻度</span><select id="scale"><option value="value">原始数值</option><option value="relative">相对峰值</option></select></label></div></div>
<p class="plot-note" id="plot-note" hidden></p><div id="plots"></div><div class="plot-footer"><span id="period"></span><span>统计时区 UTC</span></div></section>
<section class="panel details"><div class="panel-head"><h2>区间汇总</h2><button class="outline-button" id="download">导出明细 CSV ↓</button></div><div id="summary" class="table-scroll" role="region" aria-label="指标汇总" tabindex="0"></div>
<details class="period-detail" id="detail-toggle"><summary>分期明细</summary><div id="period-table" class="table-scroll" tabindex="0"></div><div class="table-footer"><span id="page-label"></span><div class="pager"><button class="icon-button" id="prev" aria-label="上一页">‹</button><button class="icon-button" id="next" aria-label="下一页">›</button></div></div></details></section>
<section class="panel details drill"><div class="panel-head"><h2>仓库详情</h2><label class="field-inline" id="rank-date-label"><span>采集日期</span><select id="rank-date"></select></label></div>
<div class="detail-tabs" id="detail-tabs" role="group" aria-label="详情类型"></div><div id="breakdowns"></div></section>
</div>
<footer class="page-footer"><span id="updated"></span><a href="https://docs.github.com/zh/rest/metrics">GitHub 统计说明 ↗</a></footer>
</main>
<!--APP-->
</body></html>
